name: Release

# Builds the "empty" flavor (portable + NSIS installer, no bundled
# Системы/Сеттинги) and publishes it as a GitHub Release whenever a tag like
# v1.2.0 is pushed. electron-updater on users' machines points at this feed.
#
# The "full" flavor contains seed data from a local database and is for private use.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, не 20: better-sqlite3 больше не публикует готовые бинарники
      # под ABI ноды 20, а сборка из исходников на раннере падает — node-gyp,
      # который тянет @electron/rebuild, не опознаёт Visual Studio 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install shared dependencies
        run: npm ci --prefix shared

      - name: Install & build server
        run: |
          cd server
          npm ci
          npm run build

      - name: Install & build client
        run: |
          npm ci --prefix client
          npm run build:standalone
          npm run build --prefix client

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Build and publish (empty flavor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.empty.json --publish always
