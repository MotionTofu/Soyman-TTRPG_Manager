# /etc/nginx/sites-available/rpg-manager
# Reverse proxy in front of the Node server on 127.0.0.1:3001 — terminates
# TLS and forwards everything, including the WebSocket upgrade Socket.IO
# needs for the "show image" push. Adjust server_name and the certbot paths
# for your domain (certbot --nginx will rewrite the ssl_* lines for you).

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;

    # ssl_certificate / ssl_certificate_key are added automatically by
    # `certbot --nginx -d YOUR_DOMAIN_HERE` — run that after this file is in
    # place instead of filling these in by hand.

    client_max_body_size 20m; # matches the server's express.json 5mb limit plus room for file uploads

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
