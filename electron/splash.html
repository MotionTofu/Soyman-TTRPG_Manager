<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>SoyMan</title>
    <!--
      Заставка на время подъёма сервера. Раньше жила строкой data:-URL прямо в
      main.js — читать и править разметку там было нельзя, поэтому вынесена в
      файл. Попадает в сборку через build.files ("electron/**/*").

      Маскот здесь нарисован без class-признаков: только куб, лицо и росток.
      Класс (воин/колдун/нетраннер) разыгрывается в клиенте на загрузку
      приложения, а до клиента тут ещё не дошло — показывать конкретного
      значило бы обещать не тот, который потом выпадет.

      Цвета проставлены числами, а не переменными: до старта клиента тему
      никто ещё не выбрал, и подставлять их неоткуда. Значения — светлый
      «Соевый панк», тот же #e8e4da, что стоит фоном окна в main.js.
    -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #e8e4da;
        color: #241e18;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        user-select: none;
      }
      .cap {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* Единственное движение на экране: три точки. Маскот не шевелится —
         анимировать рисунок незачем, а совсем неподвижная заставка читается
         зависшей. */
      .dots span {
        animation: soy-blink 1.2s infinite;
        opacity: 0.25;
      }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes soy-blink {
        0%, 60%, 100% { opacity: 0.25; }
        30% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dots span { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <svg width="62" height="66" viewBox="16 0 70 74" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SoyMan за работой">
      <defs>
        <pattern id="ht" width="3" height="3" patternUnits="userSpaceOnUse">
          <circle cx="1.2" cy="1.2" r="0.85" fill="#241e18" opacity="0.22" />
        </pattern>
      </defs>
      <!-- росток -->
      <path d="M51 18 C51 12 50 9 49 6" stroke="#241e18" stroke-width="2.4" stroke-linecap="round" />
      <path d="M49 9 C44 6 40 6.5 39 9 C41.5 11.5 46 11.5 49 9 Z" fill="#7aaa43" stroke="#241e18" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M50 6.5 C53 2.5 57.5 1.5 60 3 C59 6.5 54.5 8.5 50 6.5 Z" fill="#7aaa43" stroke="#241e18" stroke-width="1.8" stroke-linejoin="round" />
      <!-- куб -->
      <path d="M22 22 L32 14 L80 14 L70 22 Z" fill="#e0cfaa" stroke="#241e18" stroke-width="2" stroke-linejoin="round" />
      <path d="M70 22 L80 14 L80 58 L70 66 Z" fill="#e0cfaa" stroke="#241e18" stroke-width="2" stroke-linejoin="round" />
      <path d="M70 22 L80 14 L80 58 L70 66 Z" fill="url(#ht)" stroke="none" />
      <path d="M22 22 L70 22 L70 66 L22 66 Z" fill="#f5ead3" stroke="#241e18" stroke-width="2" stroke-linejoin="round" />
      <circle cx="30" cy="29" r="1.5" fill="#e0cfaa" />
      <circle cx="63" cy="31" r="1.1" fill="#e0cfaa" />
      <circle cx="27" cy="59" r="1.3" fill="#e0cfaa" />
      <circle cx="59" cy="61" r="1" fill="#e0cfaa" />
      <!-- лицо: состояние «работа» — веки опущены -->
      <path d="M33 33 L42 33" stroke="#241e18" stroke-width="2.2" stroke-linecap="round" />
      <path d="M50 31 L59 32.5" stroke="#241e18" stroke-width="2.2" stroke-linecap="round" />
      <path d="M33 41 Q37.5 46.5 42 41" stroke="#241e18" stroke-width="2.6" stroke-linecap="round" />
      <path d="M50 41 Q54.5 46.5 59 41" stroke="#241e18" stroke-width="2.6" stroke-linecap="round" />
      <ellipse cx="28.5" cy="50" rx="3.6" ry="2.4" fill="#9b3a3a" opacity="0.32" />
      <ellipse cx="63.5" cy="50" rx="3.6" ry="2.4" fill="#9b3a3a" opacity="0.32" />
      <path d="M41 52 Q46 55 51 52" stroke="#241e18" stroke-width="2.4" stroke-linecap="round" fill="none" />
    </svg>
    <div class="cap">Запускаем хранилище<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  </body>
</html>
