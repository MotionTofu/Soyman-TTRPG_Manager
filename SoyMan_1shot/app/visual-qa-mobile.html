<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneShot mobile visual QA</title>
  <style>
    body { margin: 0; padding: 20px; background: #24242a; color: #fff; font: 14px system-ui; }
    main { display: flex; flex-wrap: wrap; gap: 20px; }
    h1 { margin: 0 0 12px; font-size: 16px; }
    iframe { display: block; height: 850px; border: 2px solid #fff; background: #fff; }
    .narrow { width: 320px; }
    .standard { width: 390px; }
    .wide { width: 430px; }
  </style>
</head>
<body>
  <main>
    <section><h1>OneShot — 320 px</h1><iframe class="narrow" title="Проверка экрана 320 px" src="/visual-qa.html"></iframe></section>
    <section><h1>OneShot — 390 px</h1><iframe class="standard" title="Проверка экрана 390 px" src="/visual-qa.html"></iframe></section>
    <section><h1>OneShot — 430 px</h1><iframe class="wide" title="Проверка экрана 430 px" src="/visual-qa.html"></iframe></section>
    <section><h1>Без портрета — 390 px</h1><iframe class="standard" title="Проверка без портрета 390 px" src="/visual-qa.html?portrait=none"></iframe></section>
    <section><h1>Без портрета — 430 px</h1><iframe class="wide" title="Проверка без портрета 430 px" src="/visual-qa.html?portrait=none"></iframe></section>
    <section><h1>Без портрета — 320 px</h1><iframe class="narrow" title="Проверка без портрета 320 px" src="/visual-qa.html?portrait=none"></iframe></section>
    <section><h1>Арканум — 320 px</h1><iframe class="narrow" title="Проверка арканума 320 px" src="/visual-qa.html?case=arcanum"></iframe></section>
    <section><h1>Окна — 320 px</h1><iframe class="narrow" title="Проверка окон 320 px" src="/visual-qa.html?case=modals"></iframe></section>
    <section><h1>Окна — 390 px</h1><iframe class="standard" title="Проверка окон 390 px" src="/visual-qa.html?case=modals"></iframe></section>
  </main>
</body>
</html>
