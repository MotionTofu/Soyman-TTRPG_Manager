<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <!-- maximum-scale=1, user-scalable=no: without these, a stray double-tap
         or two-finger pinch on mobile leaves the page zoomed in with no
         obvious way back out short of reloading — this is a touch app (tap
         targets, drag-and-drop, swipeable panels), not a document meant to
         be pinch-zoomed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Without these, iOS "Add to Home Screen" launches a plain Safari
         bookmark: every navigation (even client-side react-router ones that
         change history state) can pop up Safari's own chrome — address bar,
         tab-stack icon, an "X" that closes back to wherever you were — as a
         sheet layered on top of the app instead of staying in one standalone
         window. apple-mobile-web-app-capable + the manifest's
         display:"standalone"/scope together are what keep it in one shell. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SoyMan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2b2320" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Заголовок вкладки. До этого здесь стояло «client» — имя папки,
         оставшееся от шаблона Vite: так подписывались и вкладка, и закладка,
         и всплывающие окна пультов. Имя берём то же, что в manifest.json. -->
    <title>SoyMan — TTRPG Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 3.1 — критичные шрифты предзагружаем сразу (Display/Body/UI/Mono), остальное лениво.
         Раньше 20+ семейств грузились одним блокирующим запросом ~350KB. Теперь 6 критичных
         (≈90KB) с display=swap, остальные — deferred через media=print. -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,600;0,700;1,400&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+SC:wght@500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Metamorphous&family=Big+Shoulders+Stencil:wght@600;800&family=PT+Mono&family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Comfortaa:wght@500;700&family=Cormorant:ital,wght@0,500;0,600;1,500&family=Amatic+SC:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Russo+One&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Yeseva+One&family=Fondamento&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Vollkorn:ital,wght@0,400;0,600;1,400&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Metamorphous&family=Big+Shoulders+Stencil:wght@600;800&family=PT+Mono&family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Comfortaa:wght@500;700&family=Cormorant:ital,wght@0,500;0,600;1,500&family=Amatic+SC:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Russo+One&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Yeseva+One&family=Fondamento&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Vollkorn:ital,wght@0,400;0,600;1,400&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- ПРОБА «газета»: газетный халфтон по Маллани/Инес (точка разного
         размера по яркости фото). Скрытые дефсы общего фильтра — CSS
         ссылается на него через filter:url(#soy-halftone), вход у всех
         один (SourceGraphic), поэтому фильтр один на все обложки.
         feImage+feTile с фрагментами документа — приём хромовый;
         десктоп — Electron (Chromium), там работает. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <circle id="soy-ht-1" cx="2.5" cy="2.5" r="0.7" fill="#141210" />
        <circle id="soy-ht-2" cx="2.5" cy="2.5" r="1.1" fill="#141210" />
        <circle id="soy-ht-3" cx="2.5" cy="2.5" r="1.5" fill="#141210" />
        <circle id="soy-ht-4" cx="2.5" cy="2.5" r="1.9" fill="#141210" />
        <circle id="soy-ht-5" cx="2.5" cy="2.5" r="2.2" fill="#141210" />
        <circle id="soy-ht-6" cx="2.5" cy="2.5" r="2.5" fill="#141210" />
        <filter id="soy-halftone" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feImage href="#soy-ht-1" x="0" y="0" width="5" height="5" />
          <feTile result="dot1" />
          <feImage href="#soy-ht-2" x="0" y="0" width="5" height="5" />
          <feTile result="dot2" />
          <feImage href="#soy-ht-3" x="0" y="0" width="5" height="5" />
          <feTile result="dot3" />
          <feImage href="#soy-ht-4" x="0" y="0" width="5" height="5" />
          <feTile result="dot4" />
          <feImage href="#soy-ht-5" x="0" y="0" width="5" height="5" />
          <feTile result="dot5" />
          <feImage href="#soy-ht-6" x="0" y="0" width="5" height="5" />
          <feTile result="dot6" />
          <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="lum" />
          <feComponentTransfer in="lum" result="neg">
            <feFuncA type="table" tableValues="1 0" />
          </feComponentTransfer>
          <feComponentTransfer in="neg" result="band1">
            <feFuncA type="discrete" tableValues="1 0 0 0 0 0" />
          </feComponentTransfer>
          <feComponentTransfer in="neg" result="band2">
            <feFuncA type="discrete" tableValues="0 1 0 0 0 0" />
          </feComponentTransfer>
          <feComponentTransfer in="neg" result="band3">
            <feFuncA type="discrete" tableValues="0 0 1 0 0 0" />
          </feComponentTransfer>
          <feComponentTransfer in="neg" result="band4">
            <feFuncA type="discrete" tableValues="0 0 0 1 0 0" />
          </feComponentTransfer>
          <feComponentTransfer in="neg" result="band5">
            <feFuncA type="discrete" tableValues="0 0 0 0 1 0" />
          </feComponentTransfer>
          <feComponentTransfer in="neg" result="band6">
            <feFuncA type="discrete" tableValues="0 0 0 0 0 1" />
          </feComponentTransfer>
          <feComposite in="band1" in2="dot1" operator="in" result="lev1" />
          <feComposite in="band2" in2="dot2" operator="in" result="lev2" />
          <feComposite in="band3" in2="dot3" operator="in" result="lev3" />
          <feComposite in="band4" in2="dot4" operator="in" result="lev4" />
          <feComposite in="band5" in2="dot5" operator="in" result="lev5" />
          <feComposite in="band6" in2="dot6" operator="in" result="lev6" />
          <feMerge result="dots">
            <feMergeNode in="lev6" />
            <feMergeNode in="lev5" />
            <feMergeNode in="lev4" />
            <feMergeNode in="lev3" />
            <feMergeNode in="lev2" />
            <feMergeNode in="lev1" />
          </feMerge>
          <!-- ПРОБА: точки на 15 % поверх фото, а не вместо него. -->
          <feComponentTransfer in="dots" result="dots-faint">
            <feFuncA type="linear" slope="0.15" intercept="0" />
          </feComponentTransfer>
          <feComposite in="dots-faint" in2="SourceGraphic" operator="in" result="dots-clipped" />
          <feMerge>
            <feMergeNode in="SourceGraphic" />
            <feMergeNode in="dots-clipped" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
